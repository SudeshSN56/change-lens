<title>Tic-Tac-Toe</title>
<meta name="description" content="A two-player tic-tac-toe scorecard, drawn like ink on graph paper." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --paper: #FAF8F2;
    --paper-edge: #F1EDE0;
    --grid-line: #B9C6DE;
    --ink-x: #24499B;
    --ink-x-soft: #3B5FB8;
    --ink-o: #B5402B;
    --ink-o-soft: #C6533D;
    --text: #232620;
    --text-dim: #6B6F63;
    --rule: #D8D2BF;
    --highlight: #E7B93B;
    --highlight-soft: rgba(231,185,59,0.35);
    --shadow: rgba(60,50,20,0.14);
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper: #161A17;
      --paper-edge: #1D2320;
      --grid-line: #3C4A55;
      --ink-x: #6FA1FF;
      --ink-x-soft: #8CB4FF;
      --ink-o: #FF8A68;
      --ink-o-soft: #FFA184;
      --text: #EDEAE0;
      --text-dim: #96998E;
      --rule: #34392F;
      --highlight: #E8C158;
      --highlight-soft: rgba(232,193,88,0.28);
      --shadow: rgba(0,0,0,0.45);
    }
  }

  :root[data-theme="dark"]{
    --paper: #161A17;
    --paper-edge: #1D2320;
    --grid-line: #3C4A55;
    --ink-x: #6FA1FF;
    --ink-x-soft: #8CB4FF;
    --ink-o: #FF8A68;
    --ink-o-soft: #FFA184;
    --text: #EDEAE0;
    --text-dim: #96998E;
    --rule: #34392F;
    --highlight: #E8C158;
    --highlight-soft: rgba(232,193,88,0.28);
    --shadow: rgba(0,0,0,0.45);
  }

  *{ box-sizing: border-box; }

  body{
    background: var(--paper);
    color: var(--text);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
    min-height: 100%;
  }

  .sheet{
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  header{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1.5px solid var(--rule);
    padding-bottom: 10px;
  }

  h1{
    font-family: "Caveat", cursive;
    font-weight: 700;
    font-size: 3rem;
    line-height: 1;
    margin: 0;
    color: var(--text);
    text-wrap: balance;
  }

  .file-tag{
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.68rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--text-dim);
    white-space: nowrap;
  }

  .status{
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.85rem;
    letter-spacing: 0.03em;
    color: var(--text-dim);
    min-height: 1.2em;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status .who{
    font-weight: 600;
  }
  .status .who.x{ color: var(--ink-x); }
  .status .who.o{ color: var(--ink-o); }

  .turn-dot{
    width: 9px;
    height: 9px;
    border-radius: 50%;
    display: inline-block;
  }
  .turn-dot.x{ background: var(--ink-x); }
  .turn-dot.o{ background: var(--ink-o); }

  .board-wrap{
    position: relative;
    aspect-ratio: 1;
    width: 100%;
  }

  .board{
    position: relative;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    width: 100%;
    height: 100%;
  }

  .gridline{
    position: absolute;
    background: var(--grid-line);
    border-radius: 3px;
  }
  .gridline.v{ width: 3px; height: 96%; top: 2%; }
  .gridline.h{ width: 96%; height: 3px; left: 2%; }
  .gridline.v1{ left: 33.2%; transform: rotate(-0.6deg); }
  .gridline.v2{ left: 66.4%; transform: rotate(0.5deg); }
  .gridline.h1{ top: 33.4%; transform: rotate(0.4deg); }
  .gridline.h2{ top: 66.2%; transform: rotate(-0.5deg); }

  .cell{
    position: relative;
    background: transparent;
    border: none;
    padding: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cell:focus-visible{
    outline: 2px solid var(--highlight);
    outline-offset: -4px;
    border-radius: 6px;
  }
  .cell:disabled{ cursor: default; }

  .cell svg{
    width: 56%;
    height: 56%;
    overflow: visible;
  }

  .cell .stroke{
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 9;
    stroke-dasharray: 140;
    stroke-dashoffset: 140;
    transition: stroke-dashoffset 0.32s ease;
  }
  .cell.mark-x .stroke{ stroke: var(--ink-x); }
  .cell.mark-o .stroke{ stroke: var(--ink-o); }
  .cell.drawn .stroke{ stroke-dashoffset: 0; }

  .winline{
    position: absolute;
    height: 10px;
    background: var(--highlight-soft);
    border-radius: 6px;
    transform-origin: left center;
    opacity: 0;
    transition: opacity 0.25s ease 0.15s, width 0.35s ease 0.15s;
    width: 0;
  }
  .winline.show{ opacity: 1; }

  .ledger{
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    border-top: 1.5px solid var(--rule);
    border-bottom: 1.5px solid var(--rule);
    padding: 12px 0;
  }
  .ledger .col{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-family: "IBM Plex Mono", monospace;
  }
  .ledger .col + .col{ border-left: 1px solid var(--rule); }
  .ledger .label{
    font-size: 0.66rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .ledger .label.x{ color: var(--ink-x-soft); }
  .ledger .label.o{ color: var(--ink-o-soft); }
  .ledger .count{
    font-size: 1.4rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }

  footer{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  button.action{
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 2px;
    position: relative;
  }
  button.action::after{
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 2px;
    background: var(--highlight);
    transform: scaleX(0.15);
    transform-origin: left;
    transition: transform 0.2s ease;
  }
  button.action:hover::after,
  button.action:focus-visible::after{ transform: scaleX(1); }
  button.action:focus-visible{ outline: none; }

  button.reset-score{
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    padding: 4px 2px;
  }
  button.reset-score:hover{ color: var(--text); }

  @media (prefers-reduced-motion: reduce){
    .cell .stroke, .winline, button.action::after{ transition: none; }
  }
</style>

<div class="sheet">
  <header>
    <h1>Tic&#8209;Tac&#8209;Toe</h1>
    <span class="file-tag">Sheet No. 1</span>
  </header>

  <div class="status" id="status" aria-live="polite">
    <span class="turn-dot x" id="turnDot"></span>
    <span>Turn: <span class="who x" id="turnLabel">X</span></span>
  </div>

  <div class="board-wrap">
    <div class="board" id="board" role="grid" aria-label="Tic-tac-toe board">
      <div class="gridline v v1"></div>
      <div class="gridline v v2"></div>
      <div class="gridline h h1"></div>
      <div class="gridline h h2"></div>
      <div class="winline" id="winline"></div>
      <!-- cells injected by JS -->
    </div>
  </div>

  <div class="ledger">
    <div class="col">
      <span class="label x">X wins</span>
      <span class="count" id="scoreX">0</span>
    </div>
    <div class="col">
      <span class="label">Draws</span>
      <span class="count" id="scoreD">0</span>
    </div>
    <div class="col">
      <span class="label o">O wins</span>
      <span class="count" id="scoreO">0</span>
    </div>
  </div>

  <footer>
    <button class="action" id="newRound">New round</button>
    <button class="reset-score" id="resetScore">Clear scoresheet</button>
  </footer>
</div>

<script>
(function(){
  var board = document.getElementById('board');
  var statusEl = document.getElementById('status');
  var winlineEl = document.getElementById('winline');
  var scoreXEl = document.getElementById('scoreX');
  var scoreOEl = document.getElementById('scoreO');
  var scoreDEl = document.getElementById('scoreD');

  var LINES = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  var cells = [];
  var state, current, over;
  var scores = { X: 0, O: 0, D: 0 };

  function loadScores(){
    try{
      var raw = localStorage.getItem('ttt-scores');
      if (raw){
        var parsed = JSON.parse(raw);
        if (typeof parsed.X === 'number') scores.X = parsed.X;
        if (typeof parsed.O === 'number') scores.O = parsed.O;
        if (typeof parsed.D === 'number') scores.D = parsed.D;
      }
    }catch(e){}
  }
  function saveScores(){
    try{ localStorage.setItem('ttt-scores', JSON.stringify(scores)); }catch(e){}
  }

  function buildCells(){
    for (var i = 0; i < 9; i++){
      var btn = document.createElement('button');
      btn.className = 'cell';
      btn.type = 'button';
      btn.setAttribute('role', 'gridcell');
      btn.setAttribute('aria-label', 'Cell ' + (i + 1));
      btn.dataset.index = i;
      btn.innerHTML =
        '<svg viewBox="0 0 100 100">' +
          '<path class="stroke x1" d="M22,22 L78,78"></path>' +
          '<path class="stroke x2" d="M78,22 L22,78"></path>' +
          '<circle class="stroke o1" cx="50" cy="50" r="30"></circle>' +
        '</svg>';
      btn.addEventListener('click', onCellClick);
      board.appendChild(btn);
      cells.push(btn);
    }
  }

  function newRound(){
    state = Array(9).fill(null);
    current = 'X';
    over = false;
    cells.forEach(function(c){
      c.className = 'cell';
      c.disabled = false;
    });
    winlineEl.className = 'winline';
    winlineEl.style.width = '0';
    renderStatus();
  }

  function renderStatus(){
    var cls = current.toLowerCase();
    statusEl.innerHTML =
      '<span class="turn-dot ' + cls + '"></span>' +
      '<span>Turn: <span class="who ' + cls + '">' + current + '</span></span>';
  }

  function onCellClick(e){
    if (over) return;
    var idx = Number(e.currentTarget.dataset.index);
    if (state[idx]) return;

    state[idx] = current;
    var cell = cells[idx];
    cell.classList.add('mark-' + current.toLowerCase());
    cell.disabled = true;
    requestAnimationFrame(function(){ cell.classList.add('drawn'); });

    var win = checkWin();
    if (win){
      over = true;
      scores[current] += 1;
      saveScores();
      renderScores();
      drawWinLine(win);
      announceWin(current);
      cells.forEach(function(c){ c.disabled = true; });
      return;
    }

    if (state.every(function(v){ return v; })){
      over = true;
      scores.D += 1;
      saveScores();
      renderScores();
      statusEl.innerHTML = '<span>Draw &mdash; board full</span>';
      return;
    }

    current = current === 'X' ? 'O' : 'X';
    renderStatus();
  }

  function checkWin(){
    for (var i = 0; i < LINES.length; i++){
      var l = LINES[i];
      if (state[l[0]] && state[l[0]] === state[l[1]] && state[l[1]] === state[l[2]]){
        return l;
      }
    }
    return null;
  }

  var WIN_GEOM = {
    '0,1,2': { top: '16.5%', left: '2%', width: '96%', rot: 0 },
    '3,4,5': { top: '49.5%', left: '2%', width: '96%', rot: 0 },
    '6,7,8': { top: '82.5%', left: '2%', width: '96%', rot: 0 },
    '0,3,6': { top: '50%', left: '16.5%', width: '96%', rot: 90 },
    '1,4,7': { top: '50%', left: '49.5%', width: '96%', rot: 90 },
    '2,5,8': { top: '50%', left: '82.5%', width: '96%', rot: 90 },
    '0,4,8': { top: '2%', left: '2%', width: '137%', rot: 45, corner: true },
    '2,4,6': { top: '2%', left: '98%', width: '137%', rot: 135, corner: true }
  };

  function drawWinLine(line){
    var geom = WIN_GEOM[line.join(',')];
    if (!geom) return;
    winlineEl.style.top = geom.top;
    winlineEl.style.left = geom.left;
    if (geom.corner){
      winlineEl.style.transformOrigin = '0 0';
      winlineEl.style.transform = 'translateY(-5px) rotate(' + geom.rot + 'deg)';
    } else {
      winlineEl.style.transformOrigin = '0 50%';
      winlineEl.style.transform = 'translateY(-50%) rotate(' + geom.rot + 'deg)';
    }
    winlineEl.className = 'winline show';
    requestAnimationFrame(function(){
      winlineEl.style.width = geom.width;
    });
  }

  function announceWin(winner){
    statusEl.innerHTML = '<span class="who ' + winner.toLowerCase() + '">' + winner + '</span><span>&nbsp;wins this round</span>';
  }

  function renderScores(){
    scoreXEl.textContent = scores.X;
    scoreOEl.textContent = scores.O;
    scoreDEl.textContent = scores.D;
  }

  document.getElementById('newRound').addEventListener('click', newRound);
  document.getElementById('resetScore').addEventListener('click', function(){
    scores = { X: 0, O: 0, D: 0 };
    saveScores();
    renderScores();
  });

  function boot(data){
    loadScores();
    if (data && data.scores) scores = data.scores;
    buildCells();
    renderScores();
    newRound();
    if (data && data.state && data.current){
      data.state.forEach(function(mark, i){
        if (mark){
          state[i] = mark;
          var cell = cells[i];
          cell.classList.add('mark-' + mark.toLowerCase(), 'drawn');
          cell.disabled = true;
        }
      });
      current = data.current;
      over = !!data.over;
      if (over && data.win) {
        announceWin(data.state[data.win[0]]);
        drawWinLine(data.win);
      } else if (over) {
        statusEl.innerHTML = '<span>Draw &mdash; board full</span>';
      } else {
        renderStatus();
      }
    }
  }

  if (window.claude && window.claude.hot){
    window.claude.hot.snapshot(function(){
      return { scores: scores, state: state, current: current, over: over, win: checkWin() };
    });
    window.claude.hot.ready ? window.claude.hot.ready(boot) : boot(window.claude.hot.data || {});
  } else {
    boot();
  }
})();
</script>
